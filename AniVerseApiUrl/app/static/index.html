<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniVerse Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111; color: white; margin: 0; padding: 0; }
        .navbar { background: #e50914; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .navbar h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: 1px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .search-bar { display: flex; gap: 10px; margin-bottom: 30px; background: #222; padding: 15px; border-radius: 8px; align-items: center; }
        input { padding: 12px; border: none; border-radius: 4px; background: #333; color: white; font-size: 16px; flex-grow: 1; }
        input:focus { outline: 2px solid #e50914; }
        button { padding: 12px 24px; background: #e50914; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; white-space: nowrap; }
        button:hover { background: #b20710; }
        
        /* Video Player Area */
        .player-section { display: none; margin-bottom: 40px; background: #000; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .player-section.active { display: block; }
        video { width: 100%; aspect-ratio: 16/9; background: #050505; border-radius: 8px; }
        
        .metadata { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 20px; }
        .metadata img { height: 140px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .metadata h2 { margin: 0 0 10px 0; color: #fff; font-size: 28px; font-weight: 800; }
        .metadata .badge { background: #e50914; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; display: inline-block; margin-bottom: 8px; }
        
        .log { margin-top: 15px; background: #1a1a1a; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; color: #0f0; max-height: 150px; overflow-y: auto; }
        
        /* Anime Grids */
        .section-title { font-size: 24px; font-weight: bold; margin-bottom: 15px; border-left: 4px solid #e50914; padding-left: 10px; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-bottom: 40px; }
        
        .anime-card { background: #222; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative; }
        .anime-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3); }
        .anime-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .anime-card .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 50%); display: flex; align-items: flex-end; padding: 15px; }
        .anime-card h3 { margin: 0; font-size: 14px; font-weight: 600; color: white; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(229, 9, 20, 0.9); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
        .anime-card:hover .play-icon { opacity: 1; }
        .play-icon svg { width: 20px; height: 20px; fill: white; margin-left: 4px; }
        
    </style>
</head>
<body>
    <div class="navbar">
        <h1>AniVerse</h1>
    </div>

    <div class="container">
        
        <div class="search-bar">
            <input type="text" id="animeName" placeholder="Search for Anime (e.g. Naruto, Demon Slayer)...">
            <input type="number" id="episodeNum" placeholder="Ep" value="1" style="max-width: 80px;">
            <button onclick="searchAndPlay()">Play Episode</button>
        </div>

        <!-- Video Player Section -->
        <div class="player-section" id="playerSection">
            <div class="metadata" id="metadataBox">
                <img id="metaCover" src="" alt="Cover">
                <div>
                    <span class="badge" id="metaEp">Episode 1</span>
                    <h2 id="metaTitle">Loading...</h2>
                    <p style="margin:0; color: #aaa;">AniList ID: <span id="metaId">...</span></p>
                </div>
            </div>
            
            <video id="video" controls autoplay></video>
            <div class="log" id="log">Waiting for action...</div>
        </div>

        <!-- Trending Section -->
        <h2 class="section-title">Trending Now</h2>
        <div class="anime-grid" id="trendingGrid">
            <p style="color: #aaa;">Loading trending anime...</p>
        </div>

        <!-- Popular Section -->
        <h2 class="section-title">Popular All Time</h2>
        <div class="anime-grid" id="popularGrid">
            <p style="color: #aaa;">Loading popular anime...</p>
        </div>

    </div>

    <script>
        const video = document.getElementById('video');
        const logBox = document.getElementById('log');
        const playerSection = document.getElementById('playerSection');
        let hls;

        function log(msg) {
            logBox.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Fetch Trending and Popular Lists on load
        async function loadHome() {
            try {
                // Fetch Trending
                const trendRes = await fetch('/anime/trending');
                const trendData = await trendRes.json();
                renderGrid(trendData, 'trendingGrid');
                
                // Fetch Popular
                const popRes = await fetch('/anime/popular');
                const popData = await popRes.json();
                renderGrid(popData, 'popularGrid');
            } catch (e) {
                console.error('Failed to load homepage data', e);
            }
        }

        function renderGrid(animeList, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            animeList.forEach(anime => {
                const title = anime.title.english || anime.title.romaji;
                const cover = anime.coverImage.large;
                const id = anime.id;
                
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => playDirect(id, title, cover, 1);
                
                card.innerHTML = `
                    <img src="${cover}" alt="${title}">
                    <div class="overlay">
                        <h3>${title}</h3>
                    </div>
                    <div class="play-icon">
                        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Triggered by the search bar
        async function searchAndPlay() {
            const animeName = document.getElementById('animeName').value;
            const episodeNum = document.getElementById('episodeNum').value;
            
            if(!animeName) return alert("Please enter an anime name");
            
            playerSection.classList.add('active');
            logBox.innerText = ''; 
            
            try {
                log(`Searching AniList for: "${animeName}"...`);
                const response = await fetch(`/anime/resolve_by_name/${encodeURIComponent(animeName)}/${episodeNum}`);
                const data = await response.json();
                
                if (data.detail || data.error || !data.streams || data.streams.length === 0) {
                    log(`Error: ${data.detail || data.error || 'No streams found'}`);
                    return;
                }

                // Update UI metadata
                document.getElementById('metaTitle').innerText = data.metadata.title;
                document.getElementById('metaId').innerText = data.metadata.anilist_id;
                document.getElementById('metaCover').src = data.metadata.cover;
                document.getElementById('metaEp').innerText = `Episode ${episodeNum}`;
                log(`Found Match! "${data.metadata.title}"`);

                startPlayback(data.streams[0].url);
            } catch (err) {
                log(`Fetch failed: ${err.message}`);
            }
        }

        // Triggered by clicking a poster
        async function playDirect(anilistId, title, cover, episodeNum) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            playerSection.classList.add('active');
            logBox.innerText = '';
            
            document.getElementById('metaTitle').innerText = title;
            document.getElementById('metaId').innerText = anilistId;
            document.getElementById('metaCover').src = cover;
            document.getElementById('metaEp').innerText = `Episode ${episodeNum}`;
            document.getElementById('episodeNum').value = episodeNum; // update input box
            
            try {
                log(`Requesting direct extraction for AniList ID: ${anilistId}...`);
                const response = await fetch(`/anime/resolve/${anilistId}/${episodeNum}`);
                const data = await response.json();
                
                if (data.error || !data.streams || data.streams.length === 0) {
                    log(`Error: ${data.error || 'No streams found'}`);
                    return;
                }

                log(`Successfully resolved streams from providers!`);
                startPlayback(data.streams[0].url);
            } catch (err) {
                log(`Fetch failed: ${err.message}`);
            }
        }

        function startPlayback(url) {
            log(`Loading video player...`);
            
            // Re-route the stream through our proxy backend to bypass Cloudflare and CORS
            url = `/proxy/m3u8?url=${encodeURIComponent(url)}`;
            log(`Using proxy URL: ${url}`);

            if (Hls.isSupported()) {
                if (hls) hls.destroy(); 
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    log(`Manifest parsed, playback ready!`);
                    video.play();
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) log(`HLS Error: ${data.type} - ${data.details}`);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            } else {
                log(`Your browser does not support HLS playback.`);
            }
        }

        // Initialize UI
        window.addEventListener('DOMContentLoaded', loadHome);
    </script>
</body>
</html>
