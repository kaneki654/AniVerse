name: aniverse_mobile
description: A new Flutter project.
publish_to: 'none'
version: 1.13.1+26

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  open_filex: ^4.4.0
  video_player: ^2.8.1
  cached_network_image: ^4.0.4
  google_fonts: ^8.0.0
  shimmer: ^4.0.0
  url_launcher: ^6.2.1
  google_sign_in: ^7.2.0

dev_dependencies:
  # A fake video player for the player-controls tests.
  video_player_platform_interface: any
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/aniverse_icon.png
    # The logo as pixel art, for the 2D UI (built by scripts/make_pixel_icon.py).
    - assets/icon/aniverse_icon_pixel.png

  # Pixel fonts for the 2D UI (lib/ui_2d), bundled so they render offline and
  # never fall back to a smooth system font. Both are SIL OFL 1.1; the licence
  # texts sit next to the font files.
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/aniverse_icon.png"
  adaptive_icon_background: "#0E0E0E"
  adaptive_icon_foreground: "assets/icon/aniverse_icon_fg.png"
