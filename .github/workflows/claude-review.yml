name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to review (defaults to the latest on main)"
        required: false

jobs:
  review-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Check for bugs, security issues,
            missing error handling, memory/resource leaks (C, Rust),
            null-safety and lifecycle problems (Kotlin), performance
            problems, and edge cases.

            Output issues sorted by severity (critical / major / minor),
            each with file:line, why it's a problem, and a fix.
            Skip style nitpicks. End with a one-paragraph verdict.

            Use `gh pr diff` and `gh pr view` to read the PR, then post the
            review as a single PR comment with `gh pr comment`.
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  # Commits pushed straight to main have no PR, so the review goes on the commit.
  review-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to post commit comments
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}

      - name: Work out the commit range
        id: range
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=$(git rev-parse "$HEAD_SHA^")
          fi
          echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # claude-code-action only handles PR/issue events, so run the CLI directly.
      - name: Review with Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p --allowedTools "Bash(git diff:*)" "Bash(git log:*)" "Bash(git show:*)" Read Grep Glob -- "
          Review the changes in commit range $BASE..$HEAD_SHA, which were pushed
          straight to main. Read them with git log and git diff on that range,
          and open the changed files for context. Check for bugs, security
          issues, missing error handling, memory/resource leaks, null-safety and
          lifecycle problems, performance problems, and edge cases.

          Output issues sorted by severity (critical / major / minor), each with
          file:line, why it's a problem, and a fix. Skip style nitpicks. End with
          a one-paragraph verdict. Reply with only the review in Markdown, which
          will be posted as-is as a comment on the commit.
          " > review.md
          test -s review.md

      - name: Post the review on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          gh api "repos/${{ github.repository }}/commits/$HEAD_SHA/comments" -F body=@review.md --jq .html_url
