# Every push and pull request: the server tests and type check, the website's
# scripts, and the Android app's analysis, tests and a debug build. A release
# build needs the signing key, which stays on the build machine.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["discovery/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Servers (pytest, pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          # fonttools: scripts/make_web_fonts.py, type-checked with the rest.
          pip install -r requirements.txt -r AniVerseApiUrl/requirements.txt pytest pyright fonttools
      - name: Website server tests
        run: python -m pytest -q tests
      - name: Backend tests
        working-directory: AniVerseApiUrl
        run: python -m pytest -q tests
      - name: Type check
        run: pyright

  website:
    name: Website scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every script
        run: for f in app/static/pixel/js/*.js app/static/pixel/sw.js; do node --check "$f"; done

  app:
    name: Android app (analyze, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aniverse_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Debug build
        run: flutter build apk --debug
